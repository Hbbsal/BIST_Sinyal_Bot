name: BIST Günlük Analiz

on:
  schedule:
    - cron: '13 20 * * 1-5'   # UTC 07:15 = Türkiye saatiyle 10:15
  push:
    paths:
      - "stocks.txt"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v3

      - name: Önceki stocks.txt dosyasını al
        run: |
          git fetch origin main --depth=2
          git checkout HEAD^1 -- stocks.txt || echo "" > old_stocks.txt
          mv stocks.txt new_stocks.txt

      - name: Farklı hisseleri bul
        run: |
          comm -23 <(sort old_stocks.txt) <(sort new_stocks.txt) > removed.txt
          comm -13 <(sort old_stocks.txt) <(sort new_stocks.txt) > added.txt
          echo "ADDED=$(cat added.txt | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV
          echo "REMOVED=$(cat removed.txt | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas python-telegram-bot

      - name: Botu çalıştır (değişen hisseler)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADDED: ${{ env.ADDED }}
          REMOVED: ${{ env.REMOVED }}
        run: python bist_analiz.py

name: BIST Stratos Analiz

on:
  schedule:
    - cron: '15 7 * * 1-5'   # Her hafta içi sabah 10:15 Türkiye saati
  push:
    paths:
      - "stocks.txt"
  workflow_dispatch:          # Manuel tetikleme butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Sorunun çözüldüğü adım: Hata veren pandas-ta listeden çıkarıldı, yfinance stabilize edildi
      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance pandas python-telegram-bot
          pip install ta

      - name: Stratos Analiz Botu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bist_analiz.py

name: BIST Stratos Analiz

on:
  schedule:
    # ⏱️ 1. Tetikleme: Hafta içi her sabah TSİ 10:15 (Gecikmeyle ~10:30'da cebinde)
    - cron: '15 7 * * 1-5'
    
    # ⏱️ 2. Tetikleme: Hafta içi her akşam TSİ 15:15 UTC (TSİ 18:15 yapar. Gecikmeyle ~18:30-18:45'te cebinde)
    - cron: '15 15 * * 1-5'
  push:
    paths:
      - "stocks.txt"
  workflow_dispatch:          # Manuel çalıştırma butonu her zaman aktif

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance pandas python-telegram-bot
          pip install ta

      - name: Stratos Analiz Botu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bist_analiz.py

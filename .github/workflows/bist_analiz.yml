name: BIST Stratos Analiz

on:
  schedule:
    - cron: '15 7 * * 1-5'   # Her hafta içi sabah 10:15 Türkiye saati
  push:
    paths:
      - "stocks.txt"
  workflow_dispatch:          # Manuel tetikleme butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # Node.js 24 destekli güncel aksiyon
      - name: Repo'yu çek
        uses: actions/checkout@v4

      # Python 3.10 kurulumu
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Hatanın çözüldüğü kritik yer: Tüm kütüphaneler eksiksiz yükleniyor
      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta pandas-ta python-telegram-bot

      # Stratos Botunu çalıştır
      - name: Stratos Analiz Botu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bist_analiz.py

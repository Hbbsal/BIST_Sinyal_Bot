name: BIST Stratos Analiz

on:
  schedule:
    - cron: '15 7 * * 1-5'   # Her hafta içi sabah 10:15 Türkiye saati
  workflow_dispatch:          # Manuel çalıştırma için

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta python-telegram-bot

      - name: Stratos Analiz Botu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bist_analiz.py || echo "Analiz sırasında hata oluştu ama işlem devam ediyor."
